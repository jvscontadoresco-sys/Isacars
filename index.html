<style>
  :root{--isa:#17747B;--isa-claro:#279191;--isa-noche:#064D54;--gris:#63797B;--tinta:#16292B}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#EAF4F4}
  body{font-family:Arial, Helvetica, sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}

  /* La aplicación ocupa toda la pantalla */
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}

  /* Pantalla de carga: mismo fondo que la bienvenida del sistema, para que el paso sea continuo */
  #carga{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:radial-gradient(130% 100% at 50% 35%, #FFFFFF 0%, #EAF4F4 48%, #CFE3E3 100%);
    transition:opacity .5s ease, visibility .5s ease}
  #carga.fuera{opacity:0;visibility:hidden;pointer-events:none}
  .halo{position:absolute;width:520px;height:520px;max-width:120vw;max-height:120vw;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(39,145,145,.20) 0%, rgba(39,145,145,0) 68%);
    animation:late 4.5s ease-in-out infinite}
  @keyframes late{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.12);opacity:1}}

  /* La marca aparece en gris y se llena de color de abajo hacia arriba */
  .marca{position:relative;width:118px;height:130px;margin-bottom:22px}
  .marca svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .marca .gris{filter:grayscale(1);opacity:.28}
  .marca .color{clip-path:inset(100% 0 0 0);animation:llena 2.4s cubic-bezier(.45,.05,.35,1) infinite}
  @keyframes llena{0%{clip-path:inset(100% 0 0 0)}55%,80%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}

  .nom{position:relative;font-size:22px;font-weight:bold;letter-spacing:5px;color:var(--isa-noche)}
  .nom span{font-weight:normal;color:var(--isa-claro);letter-spacing:3px}
  .regla{position:relative;height:3px;width:150px;margin:14px auto 12px;border-radius:2px;overflow:hidden;background:#D3E6E6}
  .regla i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:2px;
    background:linear-gradient(90deg,#E7CE7E,#B8891F,#E7CE7E);animation:corre 1.3s ease-in-out infinite}
  @keyframes corre{to{left:100%}}
  .sub{position:relative;font-size:11px;letter-spacing:2px;color:var(--gris);text-transform:uppercase}

  .ayuda{position:relative;margin-top:26px;max-width:340px;font-size:13px;line-height:1.5;color:var(--gris);
    animation:aparece .4s ease}
  .ayuda[hidden]{display:none}
  .ayuda a{display:inline-block;margin-top:10px;padding:9px 18px;border-radius:8px;text-decoration:none;
    background:linear-gradient(135deg,#279191 0%,#17747B 100%);color:#fff;font-weight:bold;letter-spacing:.3px;
    box-shadow:0 6px 18px rgba(6,77,84,.18)}
  .ayuda a:focus-visible{outline:3px solid #B8891F;outline-offset:2px}
  @keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion: reduce){
    .halo,.regla i{animation:none}
    .marca .color{animation:none;clip-path:none}
  }
</style>

  // Icono de la pestaña: la misma marca ISACARS.
  try {
    var marca = document.getElementById('isaMarca');
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="340 389 397 436">' + marca.innerHTML + '</svg>';
    document.getElementById('icono').href = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch (e) {}

  function leer() { try { return localStorage.getItem(LLAVE); } catch (e) { return null; } }
  function guardar(v) { try { v ? localStorage.setItem(LLAVE, v) : localStorage.removeItem(LLAVE); } catch (e) {} }

  function mostrarAyuda(texto) {
    if (listo || saliendo) return;
    if (texto) ayudaTxt.textContent = texto;
    ayuda.hidden = false;
  }

  function quitarCarga() {
    if (listo || saliendo) return;
    listo = true;
    guardar(null);
    var espera = Math.max(0, 700 - (Date.now() - inicio));   // que no parpadee
    setTimeout(function () {
      carga.classList.add('fuera');
      setTimeout(function () { carga.style.display = 'none'; }, 600);
    }, espera);
  }

  // Abre la aplicación en la ventana completa (sin marco). Siempre funciona.
  function irDirecto(recordar) {
    if (saliendo) return;
    saliendo = true;
    if (recordar) guardar(String(Date.now()));
    ayuda.hidden = true;
    var sub = document.querySelector('#carga .sub');
    if (sub) sub.textContent = 'Abriendo el sistema…';
    location.replace(DIRECTO + params);
  }

  /* ¿Google mostró la aplicación dentro del marco?
     Cuando sí, la página de Google trae la aplicación en un marco interno (frames ≥ 1).
     Cuando el teléfono bloquea las cookies de Google dentro de otra página, Google intenta
     pedir inicio de sesión, el navegador lo bloquea y el marco queda en blanco (frames = 0). */
  function marcosDentro(marco) {
    try { return marco.contentWindow ? marco.contentWindow.length : 1; } catch (e) { return 1; }
  }

  function revisar(marco) {
    if (listo || saliendo) return;
    var desde = Date.now();
    (function mirar() {
      if (listo || saliendo) return;
      if (marcosDentro(marco) > 0) { quitarCarga(); return; }
      if (Date.now() - desde >= ESPERA_MARCO) { irDirecto(true); return; }
      setTimeout(mirar, 250);
    })();
  }

  // El marco se crea ya con su dirección: así el único «load» es el de la aplicación.
  function abrir() {
    var marco = document.createElement('iframe');
    marco.id = 'app';
    marco.title = 'ISACARS · Villa Rosa';
    marco.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
    marco.addEventListener('load', function () { revisar(marco); });
    marco.src = MARCO + params;
    document.body.insertBefore(marco, carga);
    setTimeout(function () { mostrarAyuda(); }, 20000);
  }

  // Si en este equipo ya se vio que no deja abrirla dentro, se va directo.
  var antes = Number(leer() || 0);
  if (antes && Date.now() - antes < RECORDAR_DIAS * 864e5) { irDirecto(false); return; }
  guardar(null);

  if (navigator.onLine === false) {
    mostrarAyuda('Sin conexión a internet. El sistema abrirá solo cuando vuelva la conexión.');
    window.addEventListener('online', function vuelve() {
      window.removeEventListener('online', vuelve);
      ayuda.hidden = true;
      abrir();
    });
  } else {
    abrir();
  }
})();
</script>
</body>
</html>
